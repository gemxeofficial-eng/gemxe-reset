<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemxe: reset your password</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0E1C24;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 360px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { color: #8899A6; line-height: 1.5; }
    a.btn {
      display: inline-block;
      margin-top: 20px;
      background: #1EE8D0;
      color: #0E1C24;
      padding: 14px 22px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Opening Gemxe</h1>
    <p id="msg">If the app does not open, tap the button below.</p>
    <a id="open" class="btn" href="#">Reset password in Gemxe</a>
  </div>

  <script>
    // Reads the token from the email link and forwards it into the app.
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');

    if (!token) {
      document.getElementById('msg').textContent =
        'This link is incomplete. Request a new reset email from the app.';
      document.getElementById('open').style.display = 'none';
    } else {
      var target = 'gemxe-os://reset-password?token=' + encodeURIComponent(token);
      document.getElementById('open').href = target;
      window.location.href = target;
    }
  </script>
</body>
</html>
